<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-flow：行内代码右键菜单的命中条件、默认两项与目录专用项"><rect width="1200" height="640" fill="#f7f8fa"/><text x="28" y="44" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="600" fill="#1f2329" text-anchor="start">行内代码右键菜单：打开 / 复制 / 目录专用项</text><text x="28" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#8a9099" text-anchor="start">想复制代码里的路径时，不用再怕手一抖把文件点开（示意图，非截图）</text><rect x="1064" y="26" width="108" height="44" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="1064" y="54" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#1f2329" text-anchor="middle">右键 · 两项</text><rect x="28" y="100" width="560" height="296" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">对话正文</text><text x="48" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#1f2329" text-anchor="start">把仓库放到本机任意位置，然后</text><rect x="268" y="140" width="168" height="24" rx="5" fill="#f1f2f4" stroke="none" stroke-width="1" opacity="1"/><text x="275" y="157" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#1f2329">~/dsh-external-link</text><rect x="264" y="136" width="176" height="32" rx="8" fill="none" stroke="#2f6feb" stroke-width="1.2" stroke-dasharray="4 3"/><text x="444" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#1f2329" text-anchor="start">就是宿主半边。</text><path d="M432 166 l0 16 l4 -4 l3 7 l3 -1 l-3 -7 l6 -1 z" fill="#1f2329"/><rect x="328" y="196" width="190" height="76" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><rect x="334" y="202" width="178" height="28" rx="7" fill="#f2f3f5" stroke="none" stroke-width="1" opacity="1"/><text x="344" y="221" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#1f2329" text-anchor="start">打开</text><rect x="334" y="234" width="178" height="28" rx="7" fill="none" stroke="none" stroke-width="1" opacity="1"/><text x="344" y="253" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#1f2329" text-anchor="start">复制</text><text x="508" y="253" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="end">⌘C</text><text x="48" y="350" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">菜单浮在光标处，用壳自己的 Menu 组件</text><text x="48" y="370" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">↑↓/Home/End 移动 · ↵ 执行 · Esc 或点外面关闭</text><rect x="604" y="100" width="568" height="296" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="624" y="132" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">两个动作分别是什么</text><rect x="620" y="148" width="536" height="96" rx="10" fill="#fbfcfd" stroke="none" stroke-width="1" opacity="1"/><text x="636" y="176" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#2f6feb" text-anchor="start">打开</text><text x="636" y="198" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">壳自己接了线的路径：派发一次普通左键 click，走壳那条链路；</text><text x="636" y="218" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">~/… 家目录路径壳解析不了：文件由本插件展开后在右侧栏打开，目录改在文件管理器打开。</text><rect x="620" y="256" width="536" height="96" rx="10" fill="#fbfcfd" stroke="none" stroke-width="1" opacity="1"/><text x="636" y="284" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#2f6feb" text-anchor="start">复制</text><text x="636" y="306" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">把这段代码的原文写进剪贴板，成功或失败都有顶部横幅。</text><text x="636" y="326" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">剪贴板拒绝写入时如实报失败，不静默。</text><rect x="28" y="424" width="1144" height="168" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="456" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">命中条件（三条同时成立才接管这次右键）</text><text x="48" y="482" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">① 目标在 &lt;code&gt; 内，且祖先含 _markdown_（正文渲染出来的行内代码）</text><text x="48" y="504" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">② 不在 pre（多行代码块）/ [contenteditable]（输入框与快捷键编辑器）/ &lt;a href&gt;（链接另有归属）里</text><text x="48" y="526" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">③ 文本去掉空白后非空</text><rect x="44" y="542" width="1112" height="34" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="60" y="564" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">只监听 contextmenu；左键只接管「路径不存在」与 ~/… 家目录两种，其余照旧。</text><text x="28" y="624" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">单击基本照旧：路径不存在、或 ~/… 家目录路径时才接管。~/… 目录的右键菜单换成 在文件管理器中打开 / 用 VS Code 打开 / 用 Zed 打开 / 复制。</text></svg>
