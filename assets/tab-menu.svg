<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-flow：右栏页签的中键关闭与关闭其他 / 左侧 / 右侧 / 全部"><rect width="1200" height="640" fill="#f7f8fa"/><text x="28" y="44" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="600" fill="#1f2329" text-anchor="start">右栏页签：中键关一个，右键关其他 / 左侧 / 右侧 / 全部</text><text x="28" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#8a9099" text-anchor="start">页签条是官方右栏的，插件只加一条中键手势与菜单里的一个 cell（示意图，非截图）</text><rect x="28" y="100" width="620" height="360" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">右侧栏</text><rect x="48" y="148" width="104" height="32" rx="8" fill="#e8f0fe" stroke="#2f6feb" stroke-width="1" opacity="1"/><text x="62" y="169" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#2f6feb" text-anchor="start">文件</text><text x="134" y="169" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">×</text><rect x="162" y="148" width="104" height="32" rx="8" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="176" y="169" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">开始</text><text x="248" y="169" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">×</text><rect x="276" y="148" width="104" height="32" rx="8" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="290" y="169" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">终端</text><text x="362" y="169" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">×</text><rect x="48" y="196" width="132" height="24" rx="12" fill="#ffffff" stroke="#2f6feb" stroke-width="1" opacity="1"/><text x="114" y="212" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#2f6feb" text-anchor="middle">中键 · 直接关</text><text x="48" y="238" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="10" font-weight="400" fill="#8a9099" text-anchor="start">起手与释放必须在同一颗页签</text><rect x="278" y="250" width="244" height="184" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="294" y="276" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">关闭</text><text x="294" y="306" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">关闭其他页签</text><path d="M288 286 H512" stroke="#e6e8eb" stroke-width="1"/><text x="294" y="336" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">关闭左侧页签</text><path d="M288 316 H512" stroke="#e6e8eb" stroke-width="1"/><text x="294" y="366" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#8a9099" text-anchor="start">关闭右侧页签</text><path d="M288 346 H512" stroke="#e6e8eb" stroke-width="1"/><text x="294" y="396" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">关闭全部页签</text><path d="M288 376 H512" stroke="#e6e8eb" stroke-width="1"/><text x="270" y="242" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">右键页签</text><text x="48" y="446" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#8a9099" text-anchor="start">官方「关闭」保持第一行；四项只作用于这一格，摆不下的项变灰。</text><rect x="668" y="100" width="504" height="360" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="688" y="132" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">开关与边界</text><text x="688" y="162" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#1f2329" text-anchor="start">· 设置 → 心流 →「右栏页签操作」：默认开，关掉后中键与四项一起消失。</text><text x="688" y="196" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#1f2329" text-anchor="start">· 顺序只读 DOM：同一 data-dockkit-strip 内 data-dockkit-tab 的先后。</text><text x="688" y="230" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#1f2329" text-anchor="start">· 关闭只调 ctx.sidebarRight.close(tabId)：不读布局快照，不写 localStorage。</text><text x="688" y="264" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#1f2329" text-anchor="start">· 浮窗有自己的页签条，按各自的顺序算；跨分栏不动作。</text><text x="688" y="298" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#1f2329" text-anchor="start">· 只剩一个页签时只显示一条禁用提示；唯一引导页仍受官方保护。</text><rect x="684" y="340" width="472" height="70" rx="10" fill="#fbfcfd" stroke="none" stroke-width="1" opacity="1"/><text x="698" y="364" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">静默失效点</text><text x="698" y="386" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#1f2329" text-anchor="start">官方改 data-dockkit-tab / data-dockkit-strip / 右栏作用域，</text><text x="698" y="404" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#1f2329" text-anchor="start">症状只是「菜单少几项」「中键不关」，不报错。</text><rect x="28" y="482" width="1144" height="116" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="512" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">为什么不是新插件</text><text x="48" y="538" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">心流已经有设置页、菜单骨架与真浏览器验收；页签动作作为第十个开关落在这里，卸载/关掉即还原。</text><text x="48" y="560" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">官方席位是 sidebar.right.tab.menu.item（list），关闭走公开 close；没有 fork 官方包。</text><text x="28" y="624" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">示意图，非截图：本文件不含任何真实会话、工作区或账号。</text></svg>
