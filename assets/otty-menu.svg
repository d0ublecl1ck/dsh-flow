<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-flow：在官方「打开」菜单里插入一行 Otty，以及它的边界"><rect width="1200" height="640" fill="#f7f8fa"/><text x="28" y="44" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="600" fill="#1f2329" text-anchor="start">在官方「打开」菜单里加一行 Otty</text><text x="28" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#8a9099" text-anchor="start">官方目录是编译期写死的、插件注册不进去 → 这一行是本插件在菜单打开时插进去的（示意图，非截图）</text><rect x="872" y="26" width="300" height="44" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="1022" y="54" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="middle">心流 → 在「打开」菜单里加入 Otty</text><rect x="28" y="104" width="520" height="300" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#1f2329" text-anchor="start">① 会话标题行右侧那颗「打开」按钮</text><text x="48" y="160" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">只有这一颗的下拉菜单是本插件认的（侧栏 Files 页那颗形状相同，但不碰）</text><rect x="48" y="220" width="470" height="48" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><g transform="translate(64 236) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.4"><circle cx="7" cy="7" r="4.2"/><path d="M10.4 10.4 14 14" stroke-linecap="round"/></g><g transform="translate(94 236) scale(1)"><path fill-rule="evenodd" clip-rule="evenodd" fill="#8a9099" d="M8.5 5V2.02054C11.4149 2.26101 13.739 4.5851 13.9795 7.5H11C10.7239 7.5 10.5 7.72386 10.5 8C10.5 8.27614 10.7239 8.5 11 8.5H13.9795C13.739 11.4149 11.4149 13.739 8.5 13.9795V11C8.5 10.7239 8.27614 10.5 8 10.5C7.72386 10.5 7.5 10.7239 7.5 11V13.9795C4.5851 13.739 2.26101 11.4149 2.02054 8.5H5C5.27614 8.5 5.5 8.27614 5.5 8C5.5 7.72386 5.27614 7.5 5 7.5H2.02054C2.26101 4.5851 4.5851 2.26101 7.5 2.02054V5C7.5 5.27614 7.72386 5.5 8 5.5C8.27614 5.5 8.5 5.27614 8.5 5ZM1 8C1 4.13401 4.13401 1 8 1C11.866 1 15 4.13401 15 8C15 11.866 11.866 15 8 15C4.13401 15 1 11.866 1 8Z"/></g><rect x="442" y="232" width="60" height="24" rx="8" fill="#f4f5f7" stroke="#e6e8eb" stroke-width="1" opacity="1"/><g transform="translate(453 237) scale(0.875)" fill="none" stroke="#1f2329" stroke-width="1.4" stroke-linejoin="round"><path d="M2 4.4h4.2l1.3 1.7H14v6.5H2z"/></g><line x1="476" y1="237" x2="476" y2="251" stroke="#e6e8eb"/><g transform="translate(484 239) rotate(90) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 5.5 4 3 6.5"/></g><text x="48" y="312" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">点右边那个小箭头 → 官方菜单浮出</text><rect x="48" y="332" width="480" height="48" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="64" y="353" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">插件在捕获阶段认领这一下，并且只认标题行那颗：</text><text x="64" y="371" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#2f6feb" text-anchor="start">按下之后第一个出现的菜单，就是它要扩展的那一个</text><rect x="596" y="104" width="576" height="300" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="616" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#1f2329" text-anchor="start">② 菜单最后多一行 Otty</text><text x="616" y="160" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">样式从同菜单的兄弟行现抄；键盘 ↑/↓ 也能走到它</text><rect x="616" y="182" width="536" height="34" rx="9" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><rect x="628" y="191" width="16" height="16" rx="4" fill="#8a9099" stroke="none" stroke-width="1" opacity="1"/><text x="654" y="204" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">访达（默认）</text><rect x="616" y="222" width="536" height="34" rx="9" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><rect x="628" y="231" width="16" height="16" rx="4" fill="#8a9099" stroke="none" stroke-width="1" opacity="1"/><text x="654" y="244" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">Zed</text><rect x="616" y="262" width="536" height="34" rx="9" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><rect x="628" y="271" width="16" height="16" rx="4" fill="#8a9099" stroke="none" stroke-width="1" opacity="1"/><text x="654" y="284" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">iTerm2</text><rect x="616" y="302" width="536" height="34" rx="9" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><rect x="628" y="311" width="16" height="16" rx="4" fill="#8a9099" stroke="none" stroke-width="1" opacity="1"/><text x="654" y="324" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1f2329" text-anchor="start">终端</text><rect x="616" y="342" width="536" height="34" rx="9" fill="#e8f0fe" stroke="#2f6feb" stroke-width="1.4" opacity="1"/><rect x="628" y="351" width="16" height="16" rx="4" fill="#2f6feb" stroke="none" stroke-width="1" opacity="1"/><text x="654" y="364" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#2f6feb" text-anchor="start">Otty</text><text x="1140" y="364" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#2f6feb" text-anchor="end">← 插件插入</text><rect x="28" y="428" width="1144" height="164" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">这一行怎么来、什么时候在</text><text x="48" y="486" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">宿主新增 GET /flow/app-icon/&lt;id&gt;：从 .app 里 plutil + sips 提出 128px PNG，未知 id / 非 macOS 返 404（img 自己吸收）</text><text x="48" y="508" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">Otty 的启动走它自己的 otty-cli open &lt;目录&gt;：点了会真的在新 Otty 窗口里打开当前工作区</text><text x="48" y="530" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">只在本机装了 Otty、且宿主是新版时出现；仅 macOS —— 检测不到就不插，不留一个点了没反应的空行</text><rect x="44" y="546" width="1112" height="32" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="60" y="567" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">静默失效点：槽名 / data-open-target / 官方 Menu 的 role 结构任一处改名，症状只是「这一行不见了」，不报错。</text><text x="28" y="624" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">示意图，非截图：本文件不含任何真实会话、工作区或账号。</text></svg>
