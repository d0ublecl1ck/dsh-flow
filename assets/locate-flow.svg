<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-flow：⇧⌘D 定位当前会话的三步流程与 rail 边界"><rect width="1200" height="640" fill="#f7f8fa"/><text x="28" y="44" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="600" fill="#1f2329" text-anchor="start">⇧⌘D 定位当前会话</text><text x="28" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#8a9099" text-anchor="start">一次拆掉挡住它的折叠，再滚回你正在聊的那一行（示意图，非截图）</text><rect x="1054" y="26" width="118" height="44" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="1113" y="54" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="17" font-weight="600" fill="#1f2329" text-anchor="middle">⇧ ⌘ D</text><rect x="28" y="92" width="1144" height="60" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="46" y="128" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#1f2329" text-anchor="start">工作区</text><text x="106" y="128" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#2f6feb" text-anchor="start">← 我们的按钮落在搜索右侧（标题行不是 slot，靠 portal 注入）</text><g transform="translate(1126 114) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.4"><path d="M2 4.5h4l1.2 1.6H14v6.4H2z"/><path d="M11.5 2.5v4M9.5 4.5h4" stroke-linecap="round"/></g><g transform="translate(1068 114) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.4"><path d="M4.2 11.2V7.4a3.8 3.8 0 0 1 7.6 0v3.8l1 .9H3.2l1-.9Z"/><path d="M6.8 13.4a1.3 1.3 0 0 0 2.4 0"/></g><rect x="1004" y="104" width="36" height="36" rx="9" fill="#e8f0fe" stroke="#2f6feb" stroke-width="1.4" opacity="1"/><g transform="translate(1014 114) scale(1)"><path fill-rule="evenodd" clip-rule="evenodd" fill="#2f6feb" d="M8.5 5V2.02054C11.4149 2.26101 13.739 4.5851 13.9795 7.5H11C10.7239 7.5 10.5 7.72386 10.5 8C10.5 8.27614 10.7239 8.5 11 8.5H13.9795C13.739 11.4149 11.4149 13.739 8.5 13.9795V11C8.5 10.7239 8.27614 10.5 8 10.5C7.72386 10.5 7.5 10.7239 7.5 11V13.9795C4.5851 13.739 2.26101 11.4149 2.02054 8.5H5C5.27614 8.5 5.5 8.27614 5.5 8C5.5 7.72386 5.27614 7.5 5 7.5H2.02054C2.26101 4.5851 4.5851 2.26101 7.5 2.02054V5C7.5 5.27614 7.72386 5.5 8 5.5C8.27614 5.5 8.5 5.27614 8.5 5ZM1 8C1 4.13401 4.13401 1 8 1C11.866 1 15 4.13401 15 8C15 11.866 11.866 15 8 15C4.13401 15 1 11.866 1 8Z"/></g><g transform="translate(962 114) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.4"><circle cx="7" cy="7" r="4.2"/><path d="M10.4 10.4 14 14" stroke-linecap="round"/></g><rect x="28" y="176" width="271" height="424" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="44" y="206" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#1f2329" text-anchor="start">① 分组折叠</text><rect x="40" y="220" width="247" height="210" rx="10" fill="#fbfcfd" stroke="none" stroke-width="1" opacity="1"/><g transform="translate(60 240) rotate(0) scale(1)" fill="none" stroke="#1f2329" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 5.5 4 3 6.5"/></g><text x="78" y="249" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">工作区 A</text><g transform="translate(60 278) rotate(0) scale(1)" fill="none" stroke="#2f6feb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 5.5 4 3 6.5"/></g><text x="78" y="287" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">工作区 B</text><rect x="46" y="266" width="235" height="30" rx="8" fill="none" stroke="#2f6feb" stroke-width="1.2" stroke-dasharray="4 3"/><g transform="translate(60 316) rotate(0) scale(1)" fill="none" stroke="#1f2329" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 5.5 4 3 6.5"/></g><text x="78" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">工作区 C</text><rect x="48" y="336" width="231" height="106" rx="10" fill="none" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="60" y="360" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">分组折叠 = 组内一行都不渲染</text><text x="60" y="384" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">scrollIntoView 无从下手</text><text x="60" y="414" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#2f6feb" text-anchor="start">所以必须先点开它</text><text x="44" y="464" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">所属工作区分组是折起来的，行根本没渲染</text><rect x="40" y="516" width="247" height="64" rx="10" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="52" y="544" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">点一下 → 展开分组</text><text x="309" y="328" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="16" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><rect x="319" y="176" width="271" height="424" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="335" y="206" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#1f2329" text-anchor="start">② 分组内溢出折叠</text><rect x="331" y="220" width="247" height="210" rx="10" fill="#fbfcfd" stroke="none" stroke-width="1" opacity="1"/><g transform="translate(351 240) rotate(90) scale(1)" fill="none" stroke="#2f6feb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 5.5 4 3 6.5"/></g><text x="369" y="249" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">工作区 B</text><rect x="337" y="228" width="235" height="30" rx="8" fill="none" stroke="#2f6feb" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="355" y="266" width="211" height="26" rx="7" fill="none" stroke="none" stroke-width="0" opacity="1"/><circle cx="369" cy="279" r="3.2" fill="#1f2329" opacity="0.85"/><text x="379" y="283.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">更早的会话</text><rect x="355" y="296" width="211" height="26" rx="7" fill="none" stroke="none" stroke-width="0" opacity="1"/><circle cx="369" cy="309" r="3.2" fill="#1f2329" opacity="0.85"/><text x="379" y="313.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">更早的会话</text><rect x="355" y="326" width="211" height="24" rx="7" fill="none" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="365" y="342" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">还有 7 个</text><rect x="339" y="364" width="231" height="78" rx="10" fill="none" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="351" y="388" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">当前会话在折叠的尾部里</text><text x="351" y="412" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#2f6feb" text-anchor="start">overflow 行被点开即可</text><text x="335" y="464" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">分组开着，但当前会话在「还有 7 个」后面</text><rect x="331" y="516" width="247" height="64" rx="10" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="343" y="544" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">自动 → 展开溢出</text><text x="600" y="328" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="16" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><rect x="610" y="176" width="271" height="424" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="626" y="206" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#1f2329" text-anchor="start">③ 滚动 + 高亮</text><rect x="622" y="220" width="247" height="210" rx="10" fill="#fbfcfd" stroke="none" stroke-width="1" opacity="1"/><g transform="translate(642 240) rotate(90) scale(1)" fill="none" stroke="#2f6feb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 5.5 4 3 6.5"/></g><text x="660" y="249" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">工作区 B</text><rect x="628" y="228" width="235" height="30" rx="8" fill="none" stroke="#2f6feb" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="646" y="266" width="211" height="26" rx="7" fill="none" stroke="none" stroke-width="0" opacity="1"/><circle cx="660" cy="279" r="3.2" fill="#8a9099" opacity="0.5"/><text x="670" y="283.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">更早的会话</text><rect x="646" y="296" width="211" height="26" rx="7" fill="none" stroke="none" stroke-width="0" opacity="1"/><circle cx="660" cy="309" r="3.2" fill="#8a9099" opacity="0.5"/><text x="670" y="313.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">更早的会话</text><rect x="646" y="326" width="211" height="26" rx="7" fill="#e8f0fe" stroke="#2f6feb" stroke-width="1.4" opacity="1"/><circle cx="660" cy="339" r="3.2" fill="#2f6feb" opacity="0.85"/><text x="670" y="343.5" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">当前会话</text><text x="646" y="374" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#2f6feb" text-anchor="start">滚进视口 + 闪一下</text><text x="646" y="394" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">状态文本：已定位到当前会话</text><text x="626" y="464" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">行已渲染，把它滚进视口并闪一下</text><rect x="622" y="516" width="247" height="64" rx="10" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="634" y="544" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">scrollIntoView({block:&#39;nearest&#39;})</text><text x="891" y="328" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="16" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><rect x="901" y="176" width="271" height="424" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="917" y="206" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#1f2329" text-anchor="start">④ 边界：侧栏收起</text><rect x="913" y="220" width="247" height="210" rx="10" fill="#fbfcfd" stroke="none" stroke-width="1" opacity="1"/><rect x="925" y="232" width="56" height="210" rx="10" fill="#eef0f3" stroke="none" stroke-width="1" opacity="1"/><rect x="941" y="248" width="24" height="24" rx="7" fill="#d9dde3" stroke="none" stroke-width="1" opacity="1"/><rect x="941" y="282" width="24" height="24" rx="7" fill="#d9dde3" stroke="none" stroke-width="1" opacity="1"/><rect x="941" y="316" width="24" height="24" rx="7" fill="#d9dde3" stroke="none" stroke-width="1" opacity="1"/><rect x="941" y="350" width="24" height="24" rx="7" fill="#d9dde3" stroke="none" stroke-width="1" opacity="1"/><rect x="941" y="402" width="24" height="24" rx="7" fill="#d9dde3" stroke="none" stroke-width="1" opacity="1"/><text x="997" y="258" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">没有会话列表</text><text x="997" y="278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">（也没有那个按钮）</text><text x="917" y="464" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">rail 没有搜索座位，按钮不在界面上</text><rect x="913" y="516" width="247" height="64" rx="10" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="925" y="544" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">⇧⌘D 明确拒绝并说明原因，不静默无事</text><text x="28" y="624" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">三层折叠 = 侧栏 rail / 工作区分组 / 分组内溢出；前两层与「滚动」按顺序自动完成，rail 是明确拒绝而不是第四步。</text><text x="1172" y="624" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="end">图标：IntelliJ platform general/locate.svg (Apache-2.0)</text></svg>
