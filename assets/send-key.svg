<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-flow：Enter 与 Cmd/Ctrl+Enter 发送键对调，以及实现边界"><rect width="1200" height="640" fill="#f7f8fa"/><text x="28" y="44" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="600" fill="#1f2329" text-anchor="start">发送键对调：Enter 换行，⌘/Ctrl+Enter 发送</text><text x="28" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#8a9099" text-anchor="start">官方那一对键上下互换；只在对话输入框里生效（示意图，非截图）</text><rect x="964" y="26" width="208" height="44" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="1068" y="54" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#1f2329" text-anchor="middle">心流 → ⌘+Enter 发送</text><rect x="28" y="104" width="520" height="300" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#8a9099" text-anchor="start">开关关（官方行为）</text><text x="48" y="160" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">Enter 发送、Shift+Enter 换行</text><rect x="48" y="195" width="150" height="32" rx="7" fill="#f1f2f4" stroke="none" stroke-width="1" opacity="1"/><text x="123" y="216" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="middle">Enter</text><text x="220" y="216" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="244" y="216" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#1f2329" text-anchor="start">发送</text><rect x="48" y="243" width="150" height="32" rx="7" fill="#f1f2f4" stroke="none" stroke-width="1" opacity="1"/><text x="123" y="264" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="middle">⇧Enter</text><text x="220" y="264" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="244" y="264" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#1f2329" text-anchor="start">换行</text><rect x="48" y="291" width="150" height="32" rx="7" fill="#f1f2f4" stroke="none" stroke-width="1" opacity="1"/><text x="123" y="312" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="middle">⌘/Ctrl+Enter</text><text x="220" y="312" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="244" y="312" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#1f2329" text-anchor="start">另一种发送方式</text><text x="48" y="356" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">智能体运行时 Queue／Steer 的另一档，由官方设置决定</text><text x="568" y="254" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="568" y="278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="middle">开关打开</text><rect x="652" y="104" width="520" height="300" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="672" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#2f6feb" text-anchor="start">开关开：写消息时 Enter 只换行</text><text x="672" y="160" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">⌘+Enter 发送，⇧Enter 仍是换行</text><rect x="672" y="195" width="150" height="32" rx="7" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="747" y="216" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#2f6feb" text-anchor="middle">Enter</text><text x="844" y="216" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="868" y="216" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#2f6feb" text-anchor="start">换行</text><rect x="672" y="243" width="150" height="32" rx="7" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="747" y="264" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#2f6feb" text-anchor="middle">⇧Enter</text><text x="844" y="264" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="868" y="264" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#2f6feb" text-anchor="start">换行</text><rect x="672" y="291" width="150" height="32" rx="7" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="747" y="312" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#2f6feb" text-anchor="middle">⌘/Ctrl+Enter</text><text x="844" y="312" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="868" y="312" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#2f6feb" text-anchor="start">发送</text><text x="672" y="356" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">⇧⌘/Ctrl+Enter 保留官方的「另一种发送方式」</text><rect x="28" y="428" width="1144" height="164" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">实现边界：换的是「按下的那个键」，不是改写输入框</text><text x="48" y="486" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">捕获阶段拿走这一下按键，再对着同一个输入框补发官方本来就认的另一个手势 → 提交判定、撤销历史、输入法记账仍是官方那一套</text><text x="48" y="508" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">一律放行：目标不在输入框内、输入法组字中、⌥ 组合、以及 / 或 @ 菜单正有高亮候选（那一下 Enter 是「选中」）</text><text x="48" y="530" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">官方快捷键表里那 11 行只读项一个都不动（发送／换行在官方设置页仍是不可改）；开关关闭时连监听都不注册</text><rect x="44" y="546" width="1112" height="32" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="60" y="567" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">开关默认关：没打开过它的人拿到的就是官方行为；想用就在 设置 → 心流 → 「⌘+Enter 发送」里打开。</text><text x="28" y="624" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">本插件不写你的草稿内容、不碰提交链路；唯一的副作用是把一个键盘手势换成官方认的另一个。</text></svg>
