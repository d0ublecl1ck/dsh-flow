<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-flow：把当前工作区名写进「打开」按钮，以及它的实现边界"><rect width="1200" height="640" fill="#f7f8fa"/><text x="28" y="44" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="600" fill="#1f2329" text-anchor="start">工作区名写进「打开」按钮：点名字 = 点图标</text><text x="28" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#8a9099" text-anchor="start">名字是那颗按钮自己的一部分，不是旁边多出来的控件（示意图，非截图）</text><rect x="856" y="26" width="316" height="44" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="1014" y="54" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="middle">心流 → 在「打开」按钮里显示当前工作区名</text><rect x="28" y="104" width="520" height="300" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#8a9099" text-anchor="start">没有名字时（或「未分组」的会话）</text><text x="48" y="160" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">按钮保持出厂样子：图标 + 下拉箭头</text><rect x="48" y="208" width="470" height="48" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><g transform="translate(64 224) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.4"><circle cx="7" cy="7" r="4.2"/><path d="M10.4 10.4 14 14" stroke-linecap="round"/></g><g transform="translate(94 224) scale(1)"><path fill-rule="evenodd" clip-rule="evenodd" fill="#8a9099" d="M8.5 5V2.02054C11.4149 2.26101 13.739 4.5851 13.9795 7.5H11C10.7239 7.5 10.5 7.72386 10.5 8C10.5 8.27614 10.7239 8.5 11 8.5H13.9795C13.739 11.4149 11.4149 13.739 8.5 13.9795V11C8.5 10.7239 8.27614 10.5 8 10.5C7.72386 10.5 7.5 10.7239 7.5 11V13.9795C4.5851 13.739 2.26101 11.4149 2.02054 8.5H5C5.27614 8.5 5.5 8.27614 5.5 8C5.5 7.72386 5.27614 7.5 5 7.5H2.02054C2.26101 4.5851 4.5851 2.26101 7.5 2.02054V5C7.5 5.27614 7.72386 5.5 8 5.5C8.27614 5.5 8.5 5.27614 8.5 5ZM1 8C1 4.13401 4.13401 1 8 1C11.866 1 15 4.13401 15 8C15 11.866 11.866 15 8 15C4.13401 15 1 11.866 1 8Z"/></g><rect x="442" y="220" width="60" height="24" rx="8" fill="#f4f5f7" stroke="#e6e8eb" stroke-width="1" opacity="1"/><g transform="translate(453 225) scale(0.875)" fill="none" stroke="#1f2329" stroke-width="1.4" stroke-linejoin="round"><path d="M2 4.4h4.2l1.3 1.7H14v6.5H2z"/></g><line x1="476" y1="225" x2="476" y2="239" stroke="#e6e8eb"/><g transform="translate(484 227) rotate(90) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 5.5 4 3 6.5"/></g><text x="48" y="300" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">会话标题行右侧，右对齐</text><text x="48" y="328" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">同一个槽：搜索控件、插件的定位按钮、官方那颗「打开」按钮</text><text x="48" y="356" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">名字取不到就不写属性 —— 不猜、也不放占位文案</text><text x="568" y="254" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="568" y="278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="middle">有归属工作区</text><rect x="652" y="104" width="520" height="300" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="672" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#2f6feb" text-anchor="start">现在：图标左边就是当前工作区名</text><text x="672" y="160" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">侧栏分组行那个名字（工作区自己的标题）</text><rect x="672" y="208" width="470" height="48" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><g transform="translate(688 224) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.4"><circle cx="7" cy="7" r="4.2"/><path d="M10.4 10.4 14 14" stroke-linecap="round"/></g><g transform="translate(718 224) scale(1)"><path fill-rule="evenodd" clip-rule="evenodd" fill="#2f6feb" d="M8.5 5V2.02054C11.4149 2.26101 13.739 4.5851 13.9795 7.5H11C10.7239 7.5 10.5 7.72386 10.5 8C10.5 8.27614 10.7239 8.5 11 8.5H13.9795C13.739 11.4149 11.4149 13.739 8.5 13.9795V11C8.5 10.7239 8.27614 10.5 8 10.5C7.72386 10.5 7.5 10.7239 7.5 11V13.9795C4.5851 13.739 2.26101 11.4149 2.02054 8.5H5C5.27614 8.5 5.5 8.27614 5.5 8C5.5 7.72386 5.27614 7.5 5 7.5H2.02054C2.26101 4.5851 4.5851 2.26101 7.5 2.02054V5C7.5 5.27614 7.72386 5.5 8 5.5C8.27614 5.5 8.5 5.27614 8.5 5ZM1 8C1 4.13401 4.13401 1 8 1C11.866 1 15 4.13401 15 8C15 11.866 11.866 15 8 15C4.13401 15 1 11.866 1 8Z"/></g><rect x="1003.5" y="220" width="122.5" height="24" rx="8" fill="#f4f5f7" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="1014.5" y="236" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="500" fill="#2f6feb" text-anchor="start">示例工作区</text><g transform="translate(1077 225) scale(0.875)" fill="none" stroke="#1f2329" stroke-width="1.4" stroke-linejoin="round"><path d="M2 4.4h4.2l1.3 1.7H14v6.5H2z"/></g><line x1="1100" y1="225" x2="1100" y2="239" stroke="#e6e8eb"/><g transform="translate(1108 227) rotate(90) scale(1)" fill="none" stroke="#8a9099" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1.5 5.5 4 3 6.5"/></g><text x="1014.5" y="214" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="10" font-weight="400" fill="#2f6feb" text-anchor="start">名字写在这里</text><rect x="672" y="280" width="480" height="34" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="690" y="302" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">点名字 = 点图标：同一个按钮、同一条激活路径</text><text x="672" y="340" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">药丸往左长，图标不挪位；名字最长 140px 后以 … 收尾</text><rect x="28" y="428" width="1144" height="164" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">名字怎么进去的：座位写一个属性，样式表把它画出来</text><text x="48" y="486" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">座位注册在 conversation.session.header.utilities，它把名字写成官方主按钮的 data-flow-workspace，样式表用 ::before 显示</text><text x="48" y="508" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">不插节点、不改按钮行为 → 药丸的 padding、圆角、hover 底色、图标位置全部照旧；官方换掉按钮时由 childList 观察重新写上</text><text x="48" y="530" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">没有归属工作区就不写属性；开关默认开（设置 → 心流 第 8 行），关掉时把属性摘掉，按钮立刻回到出厂样子</text><rect x="44" y="546" width="1112" height="32" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="60" y="567" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">脆弱点只有一处：[data-open-target=&quot;directory&quot;] button（数据属性；旁边的 class 是构建哈希）——官方改形状时症状只是「名字不见了」，不报错。</text><text x="28" y="624" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">本插件不读工作区内容、不改那颗按钮的行为；唯一的副作用是往官方按钮上写一个属性。</text></svg>
