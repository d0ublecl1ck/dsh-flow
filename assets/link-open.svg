<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-flow：点链接交给系统默认程序（含 localhost）与宿主路由边界"><rect width="1200" height="640" fill="#f7f8fa"/><text x="28" y="44" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="600" fill="#1f2329" text-anchor="start">点链接：交给系统默认程序</text><text x="28" y="68" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#8a9099" text-anchor="start">重点是 http://localhost —— 壳本来会把它开进一个内置窗口（示意图，非截图）</text><rect x="1054" y="26" width="118" height="44" rx="10" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="1113" y="54" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#1f2329" text-anchor="middle">零配置</text><rect x="28" y="104" width="520" height="300" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#8a9099" text-anchor="start">壳默认：内置窗口</text><rect x="48" y="158" width="208" height="24" rx="5" fill="#f1f2f4" stroke="none" stroke-width="1" opacity="1"/><text x="55" y="175" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#1f2329">http://localhost:5173</text><rect x="48" y="196" width="480" height="30" rx="10" fill="#f4f5f7" stroke="none" stroke-width="1" opacity="1"/><rect x="48" y="226" width="480" height="146" rx="0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1"/><circle cx="64" cy="211" r="3" fill="#d3d7dd"/><circle cx="76" cy="211" r="3" fill="#d3d7dd"/><circle cx="88" cy="211" r="3" fill="#d3d7dd"/><text x="516" y="217" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="end">壳的内置窗口</text><rect x="48" y="196" width="480" height="176" rx="10" fill="none" stroke="#e6e8eb"/><text x="64" y="250" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">光秃秃的一个窗口</text><text x="64" y="272" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">没有标签页、没有扩展、没有登录态</text><text x="568" y="254" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="22" font-weight="400" fill="#8a9099" text-anchor="middle">→</text><text x="568" y="278" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="middle">宿主</text><rect x="652" y="104" width="520" height="300" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="672" y="136" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#2f6feb" text-anchor="start">装了本插件：系统默认程序</text><rect x="672" y="158" width="208" height="24" rx="5" fill="#f1f2f4" stroke="none" stroke-width="1" opacity="1"/><text x="679" y="175" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#1f2329">http://localhost:5173</text><rect x="668" y="154" width="216" height="32" rx="8" fill="none" stroke="#2f6feb" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="672" y="196" width="480" height="30" rx="10" fill="#eef1f5" stroke="none" stroke-width="1" opacity="1"/><rect x="672" y="226" width="480" height="146" rx="0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1"/><circle cx="688" cy="211" r="3" fill="#d3d7dd"/><circle cx="700" cy="211" r="3" fill="#d3d7dd"/><circle cx="712" cy="211" r="3" fill="#d3d7dd"/><text x="1140" y="217" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="end">系统默认浏览器</text><rect x="672" y="196" width="480" height="176" rx="10" fill="none" stroke="#e6e8eb"/><text x="688" y="250" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">你平时那个浏览器</text><text x="688" y="272" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#8a9099" text-anchor="start">标签页、扩展、登录态都在</text><rect x="28" y="428" width="1144" height="164" rx="12" fill="#ffffff" stroke="#e6e8eb" stroke-width="1" opacity="1"/><text x="48" y="460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="600" fill="#1f2329" text-anchor="start">宿主路由 POST /flow/open-external 的边界</text><text x="48" y="486" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">只放行 http / https / mailto / tel；未认证 401；只接受 POST（405）；请求体 16KB（413）；URL ≤ 8192（400）</text><text x="48" y="508" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">只把 new URL() 解析后的 href 交给打开器（macOS open / Windows start / Linux xdg-open），原始字符串不进程命令行</text><text x="48" y="530" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1f2329" text-anchor="start">同源链接、其它协议（file: / javascript: / data: / 相对路径）一律放行，应用内跳转照旧</text><rect x="44" y="546" width="1112" height="32" rx="9" fill="#e8f0fe" stroke="none" stroke-width="1" opacity="1"/><text x="60" y="567" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#2f6feb" text-anchor="start">宿主答不了（旧版宿主 / 路由不可用）时，点击回退到页面自己的 window.open —— 不会变成「点了没反应」。</text><text x="28" y="624" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#8a9099" text-anchor="start">插件自身不访问外部网络；唯一副作用是把一个 URL 交给操作系统的默认程序。</text></svg>
